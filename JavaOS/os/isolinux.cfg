display boot.msg
default javaos
prompt 1
timeout 30

label javaos
	kernel /boot/vmlinuz64
	initrd /boot/corepure64.gz,/boot/javaos.gz
	append loglevel=3 quiet text vga=0x344 video=Virtual-1:1360x768

label safe
	kernel /boot/vmlinuz64
	initrd /boot/corepure64.gz,/boot/javaos.gz
	append loglevel=3 text vga=0x318 nouveau.modeset=0

label old
	kernel /boot/vmlinuz64
	initrd /boot/corepure64.gz,/boot/javaos.gz
	append loglevel=3 quiet text vga=0x318 j2d=pixmap

label console
	kernel /boot/vmlinuz64
	initrd /boot/corepure64.gz,/boot/javaos.gz
	append loglevel=3 text javaos=off

label gui
	kernel /boot/vmlinuz64
	initrd /boot/corepure64.gz,/boot/javaos.gz
	append loglevel=3 quiet text vga=0x344 video=Virtual-1:1360x768 javaos=gui
